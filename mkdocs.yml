# Dormant website configuration, retained for future activation.
# CI checks Markdown/LaTeX sources only. No website build or deployment.
# Configure and verify an equation renderer before activating the website.

site_name: IMR
site_description: >-
  Inertial Microcavitation Rheometry: bubble dynamics solvers for
  characterizing soft materials at high strain rates
repo_url: https://github.com/mrodrig6/imrv2
repo_name: mrodrig6/imrv2
edit_uri: edit/main/docs/
copyright: Copyright &copy; The IMR developers. Released under the GNU GPL, version 3 or later.

theme:
  name: material
  icon:
    logo: material/chart-bell-curve-cumulative
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  requirements.txt
  __pycache__/

# with --strict, any of these fails the build
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - "Installation": getting-started/installation.md
      - "Quick start": getting-started/quick-start.md
      - "Keller–Miksis example": getting-started/keller-miksis.md
      - "Examples": getting-started/examples.md
  - Running:
      - "Commands": running/commands.md
      - "Configuration": running/configuration.md
      - "Outputs": running/output.md
      - "Solvers": running/solvers.md
      - "Sweeps": running/sweeps.md
      - "Waveforms": running/waveforms.md
      - "Collapse": running/collapse.md
      - "Troubleshooting": running/troubleshooting.md
  - Model:
      - "Assumptions": model/overview.md
      - "Fluid profiles": model/fluids.md
      - "Parameters": model/parameters.md
      - "Radial dynamics": model/radial-dynamics.md
      - "Stress and viscosity": model/stress-viscosity.md
      - "Heat and mass transfer": model/heat-mass-transfer.md
  - Method:
      - "Workflow": method/overview.md
      - "Discretization": method/discretization.md
      - "Integration and Jacobians": method/time-integration.md
      - "Wall boundaries": method/wall-boundaries.md
      - "Initial stress": method/initial-stress.md
      - "Equation-of-state evaluation": method/equation-of-state.md
      - "Benchmarks": method/integrator-benchmarks.md
  - Verification:
      - "Tests": verification/tests.md
      - "Equilibrium": verification/equilibrium.md
      - "Gaussian pulse": verification/gaussian.md
      - "Permutations": verification/permutations.md
      - "Regression": verification/regression.md
      - "Operators": verification/operators.md
      - "Polytropic pressure": verification/polytropic.md
      - "Numerical bug regressions": verification/numerics.md
      - "Settings and initialization audit": verification/settings.md
      - "Reported comparisons": verification/convergence.md
  - Reference:
      - Public API:
          - "Overview": reference/api.md
          - "Unified solver": reference/solve.md
          - "Nodal solver": reference/solve_nodal.md
          - "Spectral solver": reference/solve_spectral.md
          - "Inputs": reference/default_inputs.md
          - "Unit conversion": reference/nondimensionalize.md
          - "Fluid properties": reference/fluid_properties.md
          - "Sweep API": reference/sweep.md
          - "Extending": reference/extending.md
      - "Compatibility": reference/compatibility.md
      - "Function call map": reference/function-call-map.md
      - "Internal contracts": reference/internal-contracts.md
      - "Namespaces and migration": reference/namespaces.md
      - "Defaults and units": reference/defaults.md
      - "Logo": reference/branding.md
      - "Repository map": reference/repository.md
      - "CI": reference/ci.md
      - "Contributing": reference/contributing.md
      - "Citation": reference/references.md
      - "People": reference/about.md
      - Internal functions:
          - approximate_initial_stress: reference/functions/f_approx_init_stress.md
          - describe_case: reference/functions/describe_case.md
          - differentiation: reference/functions/differentiation.md
          - dual_operations: reference/functions/dual_operations.md
          - far_field_pressure: reference/functions/far_field_pressure.md
          - initial_stress: reference/functions/initial_stress.md
          - integrate: reference/functions/integrate.md
          - jacobian_nodal: reference/functions/jacobian_nodal.md
          - jacobian_pattern: reference/functions/jacobian_pattern.md
          - jacobian_spectral: reference/functions/jacobian_spectral.md
          - material_stress: reference/functions/material_stress.md
          - radial_acceleration: reference/functions/radial_acceleration.md
          - stress_power: reference/functions/stress_power.md
          - validate_case: reference/functions/validate_case.md
          - viscosity: reference/functions/viscosity.md
          - wall_mass_balance: reference/functions/wall_mass_balance.md
          - zener_field: reference/functions/zener_field.md
