# Local documentation with a strict CI build. No Pages deployment.

site_name: IMR
site_description: >-
  Inertial Microcavitation Rheometry: bubble dynamics solvers for
  characterizing soft materials at high strain rates
repo_url: https://github.com/mrodrig6/imrv2
repo_name: mrodrig6/imrv2
edit_uri: edit/main/docs/
copyright: Copyright &copy; The IMR developers. Released under the GNU GPL, version 3 or later.

theme:
  name: material
  icon:
    logo: material/chart-bell-curve-cumulative
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  requirements.txt
  __pycache__/

# with --strict, any of these fails the build
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - "Installation": getting-started/installation.md
      - "Quick start": getting-started/quick-start.md
      - "Keller–Miksis example": getting-started/keller-miksis.md
      - "Examples": getting-started/examples.md
  - Running:
      - "Commands": running/commands.md
      - "Configuration": running/configuration.md
      - "Outputs": running/output.md
      - "Solvers": running/solvers.md
      - "Sweeps": running/sweeps.md
      - "Waveforms": running/waveforms.md
      - "Collapse": running/collapse.md
      - "Troubleshooting": running/troubleshooting.md
  - MATLAB API:
      - "Overview": api/index.md
      - "Nodal solver": api/f_imr_nodal.md
      - "Spectral solver": api/f_imr_spectral.md
      - "Inputs": api/f_imr_inputs.md
      - "Unit conversion": api/f_dim2nondim.md
      - "Fluid properties": api/f_fluid_properties.md
      - "Sweep API": api/f_imr_sweep.md
      - "Extending": api/extending.md
  - Model:
      - "Assumptions": model/overview.md
      - "Fluid profiles": model/fluids.md
      - "Mercury": model/mercury.md
      - "Parameters": model/parameters.md
      - "Radial dynamics": model/radial-dynamics.md
      - "Stress and viscosity": model/stress-viscosity.md
      - "Heat and mass transfer": model/heat-mass-transfer.md
  - Method:
      - "Workflow": method/overview.md
      - "Discretization": method/discretization.md
      - "Integration and Jacobians": method/time-integration.md
      - "Wall boundaries": method/wall-boundaries.md
      - "Initial stress": method/initial-stress.md
      - "Benchmarks": method/integrator-benchmarks.md
      - "Namespace timing": method/namespace-benchmark.md
  - Theory:
      - "Radial equations": theory/radial-equations.md
      - "Stress heating": theory/stress-heating.md
      - "Viscosity integrals": theory/viscosity-integrals.md
  - Validation:
      - "Tests": validation/tests.md
      - "Polytropic pressure": validation/polytropic.md
      - "Mercury": validation/mercury.md
      - "Numerical bug regressions": validation/numerics.md
      - "Equilibrium": validation/equilibrium.md
      - "Gaussian pulse": validation/gaussian.md
      - "Permutations": validation/permutations.md
      - "Regression": validation/regression.md
      - "Operators": validation/operators.md
      - "Reported comparisons": validation/convergence.md
  - Reference:
      - "Compatibility": reference/compatibility.md
      - "Code map": reference/code-map.md
      - "Internal contracts": reference/internal-contracts.md
      - "Namespaces and migration": reference/namespaces.md
      - "Defaults and units": reference/defaults.md
      - "Logo": reference/branding.md
      - "Distributions": reference/distributions.md
      - "Repository map": reference/repository.md
      - "CI": reference/ci.md
      - "Contributing": reference/contributing.md
      - "Citation": reference/references.md
      - "People": reference/about.md
      - Internal functions:
          - f_approx_init_stress: reference/functions/f_approx_init_stress.md
          - f_call_params: reference/functions/f_call_params.md
          - f_checkers: reference/functions/f_checkers.md
          - f_diff_mat: reference/functions/f_diff_mat.md
          - f_display: reference/functions/f_display.md
          - f_dual_ops: reference/functions/f_dual_ops.md
          - f_init_stress: reference/functions/f_init_stress.md
          - f_jacobian_nodal: reference/functions/f_jacobian_nodal.md
          - f_jacobian_spectral: reference/functions/f_jacobian_spectral.md
          - f_jpattern: reference/functions/f_jpattern.md
          - f_odesolve: reference/functions/f_odesolve.md
          - f_pinfinity: reference/functions/f_pinfinity.md
          - f_radial_eq: reference/functions/f_radial_eq.md
          - f_stress: reference/functions/f_stress.md
          - f_stress_dissipation: reference/functions/f_stress_dissipation.md
          - f_viscosity: reference/functions/f_viscosity.md
          - f_wall_mass_bc: reference/functions/f_wall_mass_bc.md
