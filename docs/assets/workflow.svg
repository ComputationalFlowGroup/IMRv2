<title id="title">IMR forward simulation workflow</title>
<desc id="desc">Physical inputs and model choices are converted to dimensionless values, integrated by a MATLAB solver, and returned as histories for plots and comparison.</desc>
<rect width="960" height="150" rx="12" fill="#f1f5f9"/>
<g fill="#12304a" font-family="sans-serif" font-size="18" text-anchor="middle">
<rect x="20" y="25" width="220" height="100" rx="10" fill="#dbeafe"/>
<text x="130" y="65">Physical inputs</text><text x="130" y="95">and model choices</text>
<text x="267" y="82">→</text>
<rect x="295" y="25" width="170" height="100" rx="10" fill="#dbeafe"/>
<text x="380" y="65">Dimensionless</text><text x="380" y="95">configuration</text>
<text x="495" y="82">→</text>
<rect x="525" y="25" width="165" height="100" rx="10" fill="#dbeafe"/>
<text x="607" y="65">MATLAB</text><text x="607" y="95">solver</text>
<text x="720" y="82">→</text>
<rect x="750" y="25" width="190" height="100" rx="10" fill="#dbeafe"/>
<text x="845" y="65">Histories, plots</text><text x="845" y="95">and comparison</text>
</g></svg>
