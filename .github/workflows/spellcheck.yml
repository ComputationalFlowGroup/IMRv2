name: Code Spellcheck

on:
  push:
    branches: [ "main", "water" ]
  pull_request:
    branches: [ "main", "water" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  spellcheck:

    name: Check spelling of code and documentation
    runs-on: ubuntu-latest

    continue-on-error: true  # Does not stop other workflows

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Codespell
        run: pip install codespell

      - name: Run Codespell on MATLAB Files
        run: codespell toolchain src tests imr_setup.m --ignore-words-list="te,nd,Fom,Foh,fom" --skip="*.git,*.md,*.yml,*.json,*.mat" --quiet-level=2

      - name: Check documentation spelling
        run: codespell docs README.md CONTRIBUTING.md benchmarks/integrators/README.md --ignore-words-list="te,nd,Fom,Foh,fom" --skip="*.mat,*.jfif,*.svg,*.pdf" --quiet-level=2
