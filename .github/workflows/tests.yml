name: IMR test suites

on:
  push:
    branches: [ "main", "water" ]
  pull_request:
    branches: [ "main", "water" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  testsuite:

    name: ${{ matrix.suite }}

    runs-on: ubuntu-22.04

    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    # Each suite runs in its own job, and every suite runs even if another
    # fails. The workflow, and so the README badge, passes only when all of
    # them pass.
    strategy:
      fail-fast: false
      matrix:
        # Only regression needs stored .mat results in tests/reference.
        # Fluids use frozen observations and predictions bundled as MATLAB.
        suite:
          - s_test_suite_equilibrium
          - s_test_suite_gaussian
          - s_test_suite_permutations
          - s_test_suite_diffmat
          - s_test_suite_regression
          - s_test_suite_polytropic
          - s_test_suite_fluids
          - s_test_suite_numerics
          - s_test_suite_settings
          - s_test_suite_structure
          - s_test_suite_namespace
          - s_test_suite_solver
          - s_test_suite_validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # MathWorks activates MATLAB in GitHub Actions for public repositories
      # only; a private repository needs a batch licensing token
      - name: Check MATLAB licensing
        if: github.event.repository.private && env.MLM_LICENSE_TOKEN == ''
        run: |
          echo "::error::MATLAB runs in GitHub Actions without a license only in public repositories. This repository is private: add a MATLAB batch licensing token as the repository secret MLM_LICENSE_TOKEN (Settings > Secrets and variables > Actions)."
          exit 1

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023a
          products: MATLAB

      - name: Run ${{ matrix.suite }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd tests;
            imr_test_setup;
            ${{ matrix.suite }};
