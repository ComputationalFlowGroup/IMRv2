name: Documentation build

on:
  push:
    branches: [ "main", "water" ]
  pull_request:
    branches: [ "main", "water" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Keep one documentation build per branch.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:

    name: Build (strict)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # --strict turns every warning (broken link or anchor, page missing from
      # the nav) into an error
      - name: Build the site
        run: mkdocs build --strict

      - name: Set up documentation checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: toolchain/docs/package-lock.json

      - name: Install equation and browser checks
        working-directory: toolchain/docs
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Compile equations and check browser rendering
        run: node toolchain/docs/check.cjs site
