name: Documentation checks

on:
  push:
    branches: [ "main", "water" ]
  pull_request:
    branches: [ "main", "water" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Keep one source-documentation check per branch. No website is built.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:

    name: Markdown links and LaTeX

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Markdown and LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc jq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

      - name: Check failure detection
        run: bash toolchain/docs/test.sh

      - name: Check Markdown links and compile equations
        run: bash toolchain/docs/check.sh
